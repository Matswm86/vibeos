# VibeOS Calamares — one-click install sequence.
#
# Shown screens (the view sequence):
#   welcome → locale → keyboard → partition → users → summary
# Execution sequence (kicks off after summary confirmation):
#   partition → mount → unpackfs → machineid → fstab →
#   locale → keyboard → localecfg → users → networkcfg →
#   hwclock → services-systemd → bootloader → umount
# Then a final "finished" view with a reboot button.
#
# The "summary" screen is our confirmation screen — it shows the exact
# block device + size that will be erased, per the Day 2 risk mandate:
# "No silent auto-erase. Show /dev/... + size before proceeding."

---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id:     vibeos
    module: bootloader
    config: bootloader.conf
  - id:     bootctl
    module: shellprocess
    config: shellprocess_bootctl.conf
  - id:     cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    # Post-rsync target prep: re-create excluded dirs AND strip the live
    # session from the target (live user, NOPASSWD sudoers, live-session
    # marker, installer autostart/icons). Runs BEFORE users so the new
    # account can even reuse the name "vibeos" cleanly.
    - shellprocess
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    # Writes /etc/sddm.conf autologin for the account users just created,
    # honoring the "log in automatically" checkbox (GS autoLoginUser).
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader@vibeos
    - shellprocess@bootctl
    # Final loud assert: every live-session artifact must be GONE from the
    # target. Exits non-zero (= visible install failure) if not, so the
    # cleanup can never silently regress again. Replaces the old
    # contextualprocess config, which was written in shellprocess syntax
    # the contextualprocess module does not understand — it no-op'd for
    # every install since day 1, which is why installed systems booted
    # straight back into the live "install page" session.
    - shellprocess@cleanup
    - umount
  - show:
    - finished

branding: vibeos

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
