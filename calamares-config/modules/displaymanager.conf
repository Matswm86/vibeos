---
# Configure SDDM on the TARGET for the account the users module just
# created. Reads global storage autoLoginUser (set when the "log in
# automatically" checkbox on the users page is ticked — default ON via
# doAutoLogin in users.conf) and writes [Autologin] into /etc/sddm.conf.
#
# The live ISO's own autologin (live user "vibeos") lives in
# /etc/sddm.conf.d/autologin.conf, which SDDM reads AFTER /etc/sddm.conf
# (last value wins) — vibeos-target-cleanup.sh removes that override from
# the target, so this module's config is what actually governs login on
# the installed system.

displaymanagers:
    - sddm

defaultDesktopEnvironment:
    executable: /usr/bin/startplasma-x11
    desktopFile: plasma

# The image already has SDDM fully set up (mkosi bakes it); don't let the
# module create users/groups or rewrite sysconfig-style files.
basicSetup: false
sysconfigSetup: false
