---
# Post-unpackfs target prep (CHROOTED in the target).
#
# 1. Re-create the directories that unpackfs excluded (notably /tmp).
#    Without /tmp on the target rootfs, kernel-install fails with
#    "Failed to create staging area: No such file or directory".
# 2. Strip the live session from the target (live user + NOPASSWD
#    sudoers + live-session marker + installer autostart/icons + live
#    autologin override). Runs BEFORE the users module so the new
#    account may even be named "vibeos" without colliding. A final
#    assert pass runs at the end of the sequence (shellprocess@cleanup).

dontChroot: false
timeout:    60

script:
    - mkdir -p /tmp /var/tmp /run /mnt /media /cdrom /home /target
    - chmod 1777 /tmp /var/tmp
    - chmod 0755 /run /mnt /media /cdrom /home
    - /usr/local/sbin/vibeos-target-cleanup.sh
