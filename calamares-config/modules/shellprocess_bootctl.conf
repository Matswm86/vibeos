---
# Post-bootloader bootloader deploy. Runs HOST-SIDE (dontChroot: true) so
# it executes in the live session's normal mount namespace, NOT the
# Calamares target chroot.
#
# WHY host-side (the v2.0.0-rc1 black-screen fix):
#   The previous version ran the deploy INSIDE the chroot
#   (dontChroot: false -> vibeos-bootloader-fix.sh). Inside the chroot the
#   live USB ESP is already mounted busy/read-only in the host namespace,
#   so the script's `mount -o rw` of the live ESP failed and it SKIPPED
#   copying the /vibeos/ kernel tree + loader entries to the target ESP
#   (that copy is gated on finding the live ESP). The installed system
#   then booted systemd-boot with no kernel entry -> black screen. The
#   tell was that the script's own debug log never appeared on the live
#   ESP after an install -> it never reached the live ESP at all.
#
#   Running host-side removes the chroot mount restriction entirely. This
#   is the same namespace in which `vibeos-recover-bootloader` has always
#   worked, so the deploy is now reliable without a manual recovery pass.
#
# What vibeos-bootloader-deploy.sh does (full rationale in the script):
#   1. Locate the live ESP on the booted disk (reuse existing mount).
#   2. Locate the freshly-installed target by partlabel `vibeos-root`
#      (NOT `/`, which is the live USB here); reuse Calamares' mounts.
#   3. Copy live ESP /vibeos/ tree + loader entries to the target ESP.
#   4. Inject root=UUID= (from target fstab, blkid fallback) into every
#      loader entry + persist /etc/kernel/cmdline.
#   5. Install systemd-bootx64.efi + /EFI/BOOT/BOOTX64.EFI fallback.
#   6. Retype root partition to x86_64-root GPT type (second pathway).
#   Logs: /var/log/vibeos-bootctl-install.log (target) +
#         /vibeos-deploy-debug.log (live ESP, pull-off-USB readable).

dontChroot: true
timeout:    180

script:
    - /usr/local/sbin/vibeos-bootloader-deploy.sh
