---
# Final live-session assert (shellprocess@cleanup, end of exec sequence).
# Runs CHROOTED in the target. vibeos-target-cleanup.sh --verify exits
# non-zero if ANY live-session artifact survived (live user, NOPASSWD
# sudoers, live-session marker, installer autostart/icons, live autologin
# override) — which fails the install visibly instead of shipping a
# system that boots back into the live "install page".
#
# The actual strip runs earlier (post-unpackfs shellprocess, before the
# users module) via the same script with no arguments. One script, one
# log: /var/log/vibeos-target-cleanup.log on the installed system.

dontChroot: false
timeout:    60

script:
    - /usr/local/sbin/vibeos-target-cleanup.sh --verify
