---
# Groups for the created owner account. These MUST be groups that exist
# on Ubuntu Noble — the previous list was Arch-style (wheel / network /
# storage don't exist here) and, fatally, had no 'sudo': the installed
# owner ended up with no sudo at all (06-11 MSI field bug).
# vibeos-target-cleanup.sh --verify additionally enforces uid-1000 ∈ sudo
# at the end of every install as a fix-forward net.
defaultGroups:
    - adm
    - cdrom
    - dip
    - plugdev
    - users
    - video
    - audio
    - netdev
    - sudo

autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# Default the "log in automatically" checkbox to ON — VibeOS is a
# plug-and-play vibe-coding OS; boot should land in Plasma, not a login
# prompt. The user can untick it on the users page. The displaymanager
# module consumes the result (GS autoLoginUser) and writes /etc/sddm.conf
# on the target. (Key is doAutoLogin — capital L — in Calamares 3.3.)
doAutoLogin: true

userShell: /usr/bin/zsh

# Anything goes. User explicitly wants no rules so a Combine-day install is never
# blocked by a password validator. Empty + 1-char + dictionary words all accepted.
allowWeakPasswords:        true
allowWeakPasswordsDefault: true

passwordRequirements:
    minLength: -1
    maxLength: -1
    nonempty: false
    libpwquality:
        - minlen=1
        - minclass=0
        - dcredit=0
        - ucredit=0
        - lcredit=0
        - ocredit=0
        - difok=0
        - maxrepeat=0
        - maxclassrepeat=0
        - usercheck=0
        - dictcheck=0
        - enforcing=0
