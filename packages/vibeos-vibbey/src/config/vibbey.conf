# VibeOS Vibbey — single source of truth for all AI components.
# This file is read at startup by: vibbey (Python), vibbey.service (systemd).
# Format: KEY=VALUE  (no spaces around =, no quotes needed)
# Lines starting with # are comments and are ignored.
#
# Edit this file to change the active model or add API keys.
# After editing, restart the vibbey service:  systemctl restart vibbey

# ─── Local model (Ollama) ─────────────────────────────────────────────────────
# Runs on this machine, no account and no network. qwen2.5:3b is pre-baked into
# the ISO only so there is something working on first boot. Replace it with any
# model you pull: qwen2.5:7b, llama3.2:3b, mistral, gemma3, phi4, deepseek-r1.
#   ollama pull <model>  then set it here  then: systemctl restart vibbey
VIBEOS_MODEL=qwen2.5:3b

# ─── Hosted provider (optional) ───────────────────────────────────────────────
# Your key, your account, your choice of provider. Groq has a free tier at
# console.groq.com. Leave blank to stay fully local: nothing is sent anywhere.
VIBEOS_GROQ_API_KEY=

# Hosted model name. Only used when the key above is set. Pick whatever your
# provider currently serves: hosted catalogues change and a retired name fails
# at call time, which is why nothing here is hardcoded in the Python.
VIBEOS_GROQ_MODEL=openai/gpt-oss-120b

# ─── Agent CLI credentials ────────────────────────────────────────────────────
# The ISO ships Claude Code as the pre-installed agent CLI. It is a default, not
# a requirement: install Qwen Code, Codex CLI, opencode, aider or your own and
# use that instead. Nothing in VibeOS depends on which one you run.
VIBEOS_CLAUDE_API_KEY=
